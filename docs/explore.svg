<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="How the agents choose what to work on, as a funnel: public repos on GitHub, then repos that merge outsiders' pull requests (outside merge rate, first human reply, newcomers, AI policy), then their open issues, then issues that pass six yes/no checks, then issues whose Merge is Likely. An agent takes those, on its own desktop in a sandbox VM." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .ln { fill: none; stroke: #818b98; stroke-width: 1.4; }
    .dot { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .t { fill: #f0f6fc; }
      .m { fill: #9198a1; }
      .ln { stroke: #656c76; }
      .dot { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="orange-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d95926"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="479" rx="16"/>

  <text class="t" x="32" y="50" font-size="24" font-weight="700">How the agents choose what to work on</text>
  <text class="m" x="32" y="76" font-size="15">Each step drops what is unlikely to get merged. No overall score: raw numbers and yes/no checks.</text>

  <!-- The funnel -->
  <polygon points="34,100 490,100 466,154 58,154" fill="#86b6ef"/>
  <text x="262" y="133" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">Public repos on GitHub</text>
  <polygon points="62,162 462,162 438,216 86,216" fill="#5598e7"/>
  <text x="262" y="195" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">Repos that merge outsiders' PRs</text>
  <polygon points="90,224 434,224 410,278 114,278" fill="#2a78d6"/>
  <text x="262" y="257" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Their open issues</text>
  <polygon points="118,286 406,286 382,340 142,340" fill="#1c5cab"/>
  <text x="262" y="319" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Pass all six checks</text>
  <polygon points="146,348 378,348 354,402 170,402" fill="#104281"/>
  <text x="262" y="381" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Merge: Likely</text>

  <line x1="262" y1="404" x2="262" y2="416" stroke="#d95926" stroke-width="2" marker-end="url(#orange-head)"/>
  <rect x="152" y="422" width="220" height="38" rx="19" fill="#d95926"/>
  <text x="262" y="447" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">An agent takes it</text>

  <!-- What each step looks at -->
  <path class="ln" d="M480 127 H524"/>
  <circle class="dot" cx="524" cy="127" r="3.5"/>
  <text class="t" x="540" y="122" font-size="15" font-weight="700">Search</text>
  <text class="m" x="540" y="141" font-size="13.5">Explore searches with your profile; the agents search too.</text>

  <path class="ln" d="M452 189 H524"/>
  <circle class="dot" cx="524" cy="189" r="3.5"/>
  <text class="t" x="540" y="184" font-size="15" font-weight="700">Repo signals</text>
  <text class="m" x="540" y="203" font-size="13.5">Outside merge rate · first human reply · newcomers · AI policy</text>

  <path class="ln" d="M424 251 H524"/>
  <circle class="dot" cx="524" cy="251" r="3.5"/>
  <text class="t" x="540" y="246" font-size="15" font-weight="700">Issues</text>
  <text class="m" x="540" y="265" font-size="13.5">From the repos you keep, plus new ones from tracked repos.</text>

  <path class="ln" d="M396 313 H524"/>
  <circle class="dot" cx="524" cy="313" r="3.5"/>
  <text class="t" x="540" y="300" font-size="15" font-weight="700">Six yes/no checks</text>
  <text class="m" x="540" y="319" font-size="13.5">Belongs here · seen on Linux · not political ·</text>
  <text class="m" x="540" y="337" font-size="13.5">open to outsiders · a modest change · provable in a VM</text>

  <path class="ln" d="M368 375 H524"/>
  <circle class="dot" cx="524" cy="375" r="3.5"/>
  <text class="t" x="540" y="370" font-size="15" font-weight="700">One fixed rule</text>
  <text class="m" x="540" y="389" font-size="13.5">Not already fixed, claimed, waiting on a decision, or too big.</text>

  <path class="ln" d="M372 441 H524"/>
  <circle class="dot" cx="524" cy="441" r="3.5"/>
  <text class="t" x="540" y="436" font-size="15" font-weight="700">A sandbox VM</text>
  <text class="m" x="540" y="455" font-size="13.5">The agent gets its own Linux desktop there.</text>
</svg>
