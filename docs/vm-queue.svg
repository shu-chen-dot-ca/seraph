<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Sharing a VM. A waiting line on the left: agents with priority first, then agents reviewing a draft, then the rest. The VM on the right has desktops 1 to 3 held by agents, and desktops 4 and 5 that agents add when needed, up to Max desktops. Each desktop has its own Linux user, home folder, screen and Firefox. A load bar shows Room (the next agent gets a desktop), Full (nobody new gets one) and Overloaded (a desktop is taken back, its programs keep running)." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .ghost { fill: none; stroke: #818b98; stroke-dasharray: 5 4; }
    .bar { fill: #e6eaef; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .lab { fill: #59636e; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .hd { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .ghost { stroke: #656c76; }
      .bar { fill: #262c36; }
      .t { fill: #f0f6fc; }
      .m { fill: #9198a1; }
      .lab { fill: #9198a1; }
      .hd { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="hd"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="449" rx="16"/>

  <text class="t" x="32" y="50" font-size="24" font-weight="700">Sharing a VM</text>
  <text class="m" x="32" y="76" font-size="15">One agent per desktop. When every desktop is taken, the next agent waits in line.</text>

  <!-- The waiting line -->
  <rect class="card" x="24" y="100" width="232" height="292" rx="14"/>
  <text class="lab" x="44" y="126">WAITING LINE</text>

  <rect class="card" x="40" y="142" width="200" height="40" rx="20"/>
  <circle cx="62" cy="162" r="11" fill="#c7457a"/>
  <path d="M62 155 L64.1 159.4 L68.8 159.9 L65.3 163.1 L66.3 167.8 L62 165.4 L57.7 167.8 L58.7 163.1 L55.2 159.9 L59.9 159.4 z" fill="#ffffff"/>
  <text class="t" x="82" y="167" font-size="14" font-weight="700">agent-7</text>
  <text class="m" x="144" y="167" font-size="12.5">priority</text>

  <rect class="card" x="40" y="192" width="200" height="40" rx="20"/>
  <circle cx="62" cy="212" r="11" fill="#13896a"/>
  <text class="t" x="82" y="217" font-size="14" font-weight="700">agent-8</text>
  <text class="m" x="144" y="217" font-size="12.5">reviewing</text>

  <rect class="card" x="40" y="242" width="200" height="40" rx="20"/>
  <circle cx="62" cy="262" r="11" fill="#d4a72c"/>
  <text class="t" x="82" y="267" font-size="14" font-weight="700">agent-9</text>
  <text class="m" x="144" y="267" font-size="12.5">new issue</text>

  <g class="m" font-size="12.5">
    <text x="44" y="314">First: priority (a PR that needs</text>
    <text x="44" y="332">action, or Give priority).</text>
    <text x="44" y="350">Then: agents reviewing a draft.</text>
    <text x="44" y="368">Priority also gets 10× the CPU.</text>
  </g>

  <line x1="258" y1="212" x2="286" y2="212" stroke-width="2" class="hd" stroke="#818b98" marker-end="url(#head)"/>

  <!-- The VM -->
  <rect x="290" y="100" width="686" height="292" rx="14" fill="#d95926" fill-opacity="0.08" stroke="#d95926" stroke-opacity="0.6"/>
  <text class="lab" x="310" y="126">VM1 · INCUS KVM</text>
  <text class="m" x="956" y="126" font-size="12.5" text-anchor="end">8 CPUs · 8 GB · 128 GB disk by default</text>

  <rect class="card" x="310" y="142" width="118" height="80" rx="8"/>
  <rect class="bar" x="311" y="143" width="116" height="12" rx="7"/>
  <circle cx="369" cy="190" r="15" fill="#2a78d6"/>
  <text x="369" y="195" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text class="t" x="310" y="244" font-size="13.5" font-weight="700">Desktop 1</text>
  <text class="m" x="310" y="262" font-size="12.5">agent-1 · fixing</text>

  <rect class="card" x="442" y="142" width="118" height="80" rx="8"/>
  <rect class="bar" x="443" y="143" width="116" height="12" rx="7"/>
  <circle cx="501" cy="190" r="15" fill="#5b4bc4"/>
  <text x="501" y="195" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text class="t" x="442" y="244" font-size="13.5" font-weight="700">Desktop 2</text>
  <text class="m" x="442" y="262" font-size="12.5">agent-2 · tests run</text>

  <rect class="card" x="574" y="142" width="118" height="80" rx="8"/>
  <rect class="bar" x="575" y="143" width="116" height="12" rx="7"/>
  <circle cx="633" cy="190" r="15" fill="#1a7f37"/>
  <text x="633" y="195" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text class="t" x="574" y="244" font-size="13.5" font-weight="700">Desktop 3</text>
  <text class="m" x="574" y="262" font-size="12.5">agent-3 · drafting</text>

  <rect class="ghost" x="706" y="142" width="118" height="80" rx="8"/>
  <path class="hd" d="M762 175 h6 v9 h9 v6 h-9 v9 h-6 v-9 h-9 v-6 h9 z"/>
  <text class="t" x="706" y="244" font-size="13.5" font-weight="700">Desktop 4</text>
  <text class="m" x="706" y="262" font-size="12.5">added when needed</text>

  <rect class="ghost" x="838" y="142" width="118" height="80" rx="8"/>
  <path class="hd" d="M894 175 h6 v9 h9 v6 h-9 v9 h-6 v-9 h-9 v-6 h9 z"/>
  <text class="t" x="838" y="244" font-size="13.5" font-weight="700">Desktop 5</text>
  <text class="m" x="838" y="262" font-size="12.5">up to Max desktops</text>

  <text class="m" x="310" y="292" font-size="13">Each desktop has its own Linux user, home folder, screen and Firefox.</text>

  <!-- How busy the VM is -->
  <text class="t" x="310" y="320" font-size="12.5" font-weight="700">How busy the VM is (CPU and memory)</text>
  <rect x="310" y="330" width="288" height="12" rx="6" fill="#1a7f37"/>
  <rect x="602" y="330" width="166" height="12" rx="6" fill="#d4a72c"/>
  <rect x="772" y="330" width="184" height="12" rx="6" fill="#cf222e"/>
  <text class="t" x="310" y="362" font-size="12.5" font-weight="700">Room</text>
  <text class="m" x="310" y="378" font-size="12">the next agent gets a desktop</text>
  <text class="t" x="602" y="362" font-size="12.5" font-weight="700">Full</text>
  <text class="m" x="602" y="378" font-size="12">nobody new gets one</text>
  <text class="t" x="772" y="362" font-size="12.5" font-weight="700">Overloaded</text>
  <text class="m" x="772" y="378" font-size="12">a desktop is taken back</text>

  <text class="m" x="32" y="424" font-size="13.5">Long test runs go on in the background: the agent keeps its desktop and sleeps until they end. You can watch any desktop live, or take it over.</text>
</svg>
