<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Where everything runs. GitHub and the internet on top. Your computer runs the Seraph backend (FastAPI, 127.0.0.1 only), the drafts, the agents (Claude Agent SDK) and every token. It reads GitHub with search tokens and writes to GitHub after a reviewer agent passes a draft, as you. Sandbox VMs (Incus KVM) hold one agent per desktop; the agents drive them with screen, keys and shell and get back screenshots, diffs and test results. VMs have no tokens, reach the internet only, and are blocked from your computer and local network." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .zone { fill: #eaeef2; stroke: #d1d9e0; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .bar { fill: #e6eaef; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .lab { fill: #59636e; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .ln { fill: none; stroke: #818b98; stroke-width: 1.6; }
    .hd { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .zone { fill: #212830; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .bar { fill: #262c36; }
      .t { fill: #f0f6fc; }
      .m { fill: #9198a1; }
      .lab { fill: #9198a1; }
      .ln { stroke: #656c76; }
      .hd { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="hd"/>
    </marker>
    <marker id="blue-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="green-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="orange-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d95926"/>
    </marker>
    <marker id="magenta-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c7457a"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="559" rx="16"/>

  <text class="t" x="32" y="50" font-size="24" font-weight="700">Where everything runs</text>
  <text class="m" x="32" y="76" font-size="15">Tokens never reach a VM. Code from the internet only ever runs inside one.</text>

  <!-- GitHub and the internet -->
  <rect class="zone" x="24" y="92" width="952" height="88" rx="14"/>
  <text class="lab" x="44" y="114">GITHUB &amp; THE INTERNET</text>
  <rect class="card" x="156" y="124" width="300" height="42" rx="10"/>
  <text class="t" x="306" y="150" font-size="14" font-weight="600" text-anchor="middle">Repos · issues · pull requests</text>
  <rect class="card" x="470" y="124" width="220" height="42" rx="10"/>
  <text class="t" x="580" y="150" font-size="14" font-weight="600" text-anchor="middle">Your fork → pull request</text>
  <rect class="card" x="710" y="124" width="246" height="42" rx="10"/>
  <text class="t" x="833" y="150" font-size="14" font-weight="600" text-anchor="middle">Packages · docs · mirrors</text>

  <!-- You -->
  <rect x="24" y="252" width="148" height="100" rx="12" fill="#c7457a" fill-opacity="0.10" stroke="#c7457a"/>
  <text class="t" x="98" y="284" font-size="17" font-weight="700" text-anchor="middle">You</text>
  <text class="m" x="98" y="306" font-size="13" text-anchor="middle">browser</text>
  <text class="m" x="98" y="326" font-size="13" text-anchor="middle">sets the limits</text>
  <line x1="174" y1="285" x2="214" y2="285" stroke="#c7457a" stroke-width="2" marker-end="url(#magenta-head)"/>

  <!-- Your computer -->
  <rect x="196" y="212" width="400" height="324" rx="16" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.55"/>
  <text class="lab" x="216" y="236">YOUR COMPUTER</text>

  <rect class="card" x="218" y="252" width="176" height="66" rx="10"/>
  <text class="t" x="306" y="279" font-size="15" font-weight="700" text-anchor="middle">Seraph backend</text>
  <text class="m" x="306" y="300" font-size="12.5" text-anchor="middle">FastAPI · 127.0.0.1 only</text>

  <rect class="card" x="414" y="252" width="160" height="66" rx="10"/>
  <text class="t" x="494" y="279" font-size="15" font-weight="700" text-anchor="middle">Drafts</text>
  <text class="m" x="494" y="300" font-size="12.5" text-anchor="middle">sent once reviewed</text>

  <rect class="card" x="218" y="344" width="356" height="66" rx="10"/>
  <text class="t" x="396" y="371" font-size="15" font-weight="700" text-anchor="middle">Agents</text>
  <text class="m" x="396" y="392" font-size="12.5" text-anchor="middle">Claude Agent SDK · one chat each · a reviewer agent</text>

  <line class="ln" x1="306" y1="320" x2="306" y2="342" marker-start="url(#head)" marker-end="url(#head)"/>
  <line class="ln" x1="494" y1="342" x2="494" y2="320" marker-end="url(#head)"/>
  <text class="m" x="502" y="336" font-size="11.5">drafts</text>

  <rect x="218" y="436" width="356" height="76" rx="10" fill="#1a7f37" fill-opacity="0.08" stroke="#1a7f37" stroke-opacity="0.6"/>
  <rect x="238" y="466" width="20" height="16" rx="3" fill="#1a7f37"/>
  <path d="M242 466 V460 A6 6 0 0 1 254 460 V466" fill="none" stroke="#1a7f37" stroke-width="2.4"/>
  <text class="t" x="274" y="462" font-size="15" font-weight="700">Tokens</text>
  <text class="m" x="274" y="482" font-size="12.5">Kept in AWS Secrets Manager, read into memory.</text>
  <text class="m" x="274" y="500" font-size="12.5">Never sent to the browser, an agent or a VM.</text>

  <!-- Reads and writes to GitHub -->
  <line x1="306" y1="168" x2="306" y2="248" stroke="#2a78d6" stroke-width="2" marker-end="url(#blue-head)"/>
  <text class="m" x="314" y="203" font-size="12">reads, with search tokens</text>
  <line x1="494" y1="250" x2="494" y2="170" stroke="#1a7f37" stroke-width="2.6" marker-end="url(#green-head)"/>
  <text class="t" x="502" y="196" font-size="12" font-weight="600">after review,</text>
  <text class="t" x="502" y="210" font-size="12" font-weight="600">sent as you</text>

  <!-- Sandbox VMs -->
  <rect x="700" y="212" width="276" height="324" rx="16" fill="#d95926" fill-opacity="0.08" stroke="#d95926" stroke-opacity="0.6"/>
  <text class="lab" x="720" y="236">SANDBOX VMs · INCUS KVM</text>

  <rect class="card" x="720" y="252" width="236" height="158" rx="10"/>
  <text class="t" x="736" y="274" font-size="14" font-weight="700">vm1</text>
  <rect class="card" x="736" y="286" width="60" height="56" rx="6"/>
  <rect class="bar" x="737" y="287" width="58" height="9" rx="5"/>
  <circle cx="766" cy="319" r="10" fill="#2a78d6"/>
  <rect class="card" x="808" y="286" width="60" height="56" rx="6"/>
  <rect class="bar" x="809" y="287" width="58" height="9" rx="5"/>
  <circle cx="838" cy="319" r="10" fill="#5b4bc4"/>
  <rect class="card" x="880" y="286" width="60" height="56" rx="6"/>
  <rect class="bar" x="881" y="287" width="58" height="9" rx="5"/>
  <circle cx="910" cy="319" r="10" fill="#13896a"/>
  <g class="m" font-size="11.5" text-anchor="middle">
    <text x="766" y="360">Desktop 1</text>
    <text x="838" y="360">Desktop 2</text>
    <text x="910" y="360">Desktop 3</text>
  </g>
  <text class="m" x="838" y="392" font-size="12.5" text-anchor="middle">one agent per desktop</text>

  <line x1="576" y1="364" x2="716" y2="364" stroke="#d95926" stroke-width="2" marker-end="url(#orange-head)"/>
  <text class="m" x="646" y="354" font-size="11.5" text-anchor="middle">screen · keys · shell</text>
  <line x1="718" y1="390" x2="578" y2="390" stroke="#d95926" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#orange-head)"/>
  <text class="m" x="646" y="408" font-size="11.5" text-anchor="middle">screenshots · diffs · tests</text>

  <line class="ln" x1="833" y1="210" x2="833" y2="170" stroke-dasharray="5 4" marker-end="url(#head)"/>
  <text class="m" x="841" y="196" font-size="12">internet only</text>

  <g font-size="13">
    <path d="M724 434 L734 444 M734 434 L724 444" stroke="#cf222e" stroke-width="2.4" stroke-linecap="round"/>
    <text class="t" x="746" y="444">No tokens, no sign-in</text>
    <path d="M724 460 L734 470 M734 460 L724 470" stroke="#cf222e" stroke-width="2.4" stroke-linecap="round"/>
    <text class="t" x="746" y="470">No way to your computer or LAN</text>
    <path d="M723 492 L728 497 L736 486" fill="none" stroke="#1a7f37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="746" y="496">Internet for packages and docs</text>
  </g>

  <!-- Blocked: VMs can't reach your computer -->
  <line x1="698" y1="470" x2="600" y2="470" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="648" cy="470" r="11" fill="#cf222e"/>
  <path d="M643 465 L653 475 M653 465 L643 475" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text class="m" x="648" y="498" font-size="12" text-anchor="middle">blocked</text>
</svg>
