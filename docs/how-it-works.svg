<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="How an issue becomes a merged pull request in Seraph, in six steps: Find projects that merge outside work, Pick issues likely to be merged, Fix it in a sandbox VM, Review by a reviewer agent, Approve by you, and Follow up until merged. Review comments and failing checks go back to the VM. Inside the VM every fix goes through understand, set up, reproduce, fix, test and draft." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .hd { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .t { fill: #f0f6fc; }
      .m { fill: #9198a1; }
      .hd { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="green-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="459" rx="16"/>

  <text class="t" x="32" y="50" font-size="24" font-weight="700">From issue to merged pull request</text>
  <text class="m" x="32" y="76" font-size="15">The same six steps for every issue. Nothing is posted to GitHub until you approve it.</text>

  <!-- The six steps -->
  <polygon points="24,100 175,100 191,125 175,150 24,150" fill="#2a78d6"/>
  <text x="107" y="131" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1  Find</text>
  <polygon points="181,100 332,100 348,125 332,150 181,150 197,125" fill="#5b4bc4"/>
  <text x="265" y="131" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2  Pick</text>
  <polygon points="338,100 489,100 505,125 489,150 338,150 354,125" fill="#d95926"/>
  <text x="422" y="131" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3  Fix</text>
  <polygon points="495,100 646,100 662,125 646,150 495,150 511,125" fill="#13896a"/>
  <text x="579" y="131" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4  Review</text>
  <polygon points="652,100 803,100 819,125 803,150 652,150 668,125" fill="#c7457a"/>
  <text x="736" y="131" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5  Approve</text>
  <polygon points="809,100 960,100 976,125 960,150 809,150 825,125" fill="#1a7f37"/>
  <text x="893" y="131" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6  Follow up</text>

  <g class="t" font-size="14">
    <text x="34" y="182">Explore searches</text>
    <text x="34" y="202">GitHub for projects</text>
    <text x="34" y="222">that merge work</text>
    <text x="34" y="242">from outsiders.</text>

    <text x="193" y="182">Six yes/no checks</text>
    <text x="193" y="202">keep the issues</text>
    <text x="193" y="222">maintainers are</text>
    <text x="193" y="242">likely to merge.</text>

    <text x="350" y="182">An agent fixes it</text>
    <text x="350" y="202">on its own Linux</text>
    <text x="350" y="222">desktop in a VM,</text>
    <text x="350" y="242">with real proof.</text>

    <text x="507" y="182">A reviewer agent</text>
    <text x="507" y="202">checks the fix the</text>
    <text x="507" y="222">way the project's</text>
    <text x="507" y="242">maintainers will.</text>

    <text x="664" y="182">You read the draft</text>
    <text x="664" y="202">in the Inbox, edit it</text>
    <text x="664" y="222">if you like, and</text>
    <text x="664" y="242">press Approve.</text>

    <text x="821" y="182">Opened as you. The</text>
    <text x="821" y="202">PR's agent answers</text>
    <text x="821" y="222">reviews and fixes</text>
    <text x="821" y="242">checks to the end.</text>
  </g>

  <!-- Where each step happens -->
  <g font-size="12.5">
    <rect class="card" x="34" y="262" width="102" height="24" rx="12"/>
    <text class="m" x="85" y="278" text-anchor="middle">reads GitHub</text>
    <rect class="card" x="193" y="262" width="110" height="24" rx="12"/>
    <text class="m" x="248" y="278" text-anchor="middle">your computer</text>
    <rect class="card" x="350" y="262" width="96" height="24" rx="12"/>
    <text class="m" x="398" y="278" text-anchor="middle">sandbox VM</text>
    <rect class="card" x="507" y="262" width="96" height="24" rx="12"/>
    <text class="m" x="555" y="278" text-anchor="middle">sandbox VM</text>
    <rect class="card" x="664" y="262" width="92" height="24" rx="12"/>
    <text class="m" x="710" y="278" text-anchor="middle">you decide</text>
    <rect x="821" y="262" width="128" height="24" rx="12" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37"/>
    <text class="t" x="885" y="278" text-anchor="middle" font-weight="600">writes to GitHub</text>
  </g>

  <!-- Follow-ups go back to the VM -->
  <path d="M885 290 V318 Q885 330 873 330 H410 Q398 330 398 318 V294" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#green-head)"/>
  <text class="m" x="642" y="352" font-size="13.5" text-anchor="middle">A review asks for changes, or a check fails? Back to the VM, then back to you.</text>

  <!-- Inside the VM -->
  <text class="t" x="32" y="404" font-size="14" font-weight="700">Inside the VM</text>
  <text class="m" x="32" y="424" font-size="13">every fix, the same steps</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="230" y="391" width="100" height="34" rx="17" fill="#d95926" fill-opacity="0.12" stroke="#d95926"/>
    <text class="t" x="280" y="413">Understand</text>
    <rect x="358" y="391" width="100" height="34" rx="17" fill="#d95926" fill-opacity="0.24" stroke="#d95926"/>
    <text class="t" x="408" y="413">Set up</text>
    <rect x="486" y="391" width="100" height="34" rx="17" fill="#d95926" fill-opacity="0.36" stroke="#d95926"/>
    <text class="t" x="536" y="413">Reproduce</text>
    <rect x="614" y="391" width="100" height="34" rx="17" fill="#d95926" fill-opacity="0.48" stroke="#d95926"/>
    <text class="t" x="664" y="413">Fix</text>
    <rect x="742" y="391" width="100" height="34" rx="17" fill="#d95926" fill-opacity="0.60" stroke="#d95926"/>
    <text class="t" x="792" y="413">Test</text>
    <rect x="870" y="391" width="100" height="34" rx="17" fill="#d95926" fill-opacity="0.72" stroke="#d95926"/>
    <text class="t" x="920" y="413">Draft</text>
  </g>
  <g class="hd">
    <path d="M338 402 L348 408 L338 414 z"/>
    <path d="M466 402 L476 408 L466 414 z"/>
    <path d="M594 402 L604 408 L594 414 z"/>
    <path d="M722 402 L732 408 L722 414 z"/>
    <path d="M850 402 L860 408 L850 414 z"/>
  </g>
</svg>
